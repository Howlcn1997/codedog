name: CI

on:
  push:
    branches: [master, swiftui]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core tests
        run: make test
      - name: Build app
        run: make build
      - name: Show build errors
        if: failure()
        run: grep -n -E "error|Error" build/xcodebuild*.log | head -80 || true
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild*.log
          if-no-files-found: ignore

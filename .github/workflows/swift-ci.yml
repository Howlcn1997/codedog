name: CI

on:
  push:
    branches: [master, swiftui]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core tests
        run: make test
      - name: Build app
        run: make build

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify tag matches MARKETING_VERSION
        run: |
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9][^"]*)"?.*/\1/p' project.yml | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project.yml version $VERSION"
            exit 1
          fi

      - name: Core tests
        run: make test

      - name: Build universal app (ad-hoc signed)
        run: scripts/release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag

      - name: Show build errors
        if: failure()
        run: grep -n -E "error|Error" build/xcodebuild*.log | head -80 || true
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild*.log
          if-no-files-found: ignore
